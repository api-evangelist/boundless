name: Boundless
description: 'Boundless is a Seattle-based technology-enabled immigration company that pairs an
  intuitive online platform with licensed immigration attorneys to help individuals and businesses
  navigate U.S. immigration. Its consumer products cover family-based green cards, marriage and fiancé
  (K-1) visas, naturalization and citizenship, and employment-based visas such as H-1B, EB-1, O-1, and
  E-2, while its business offering adds corporate case management, workflow automation, employee
  engagement, compliance management, HR-system integration, and global mobility support for
  immigration teams. Boundless is backed by Foundry Group and Seedcamp. No public developer API,
  documentation portal, or SDKs are published at this time.'
